server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Official YouTube source plugin for Lavalink v4
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "${LAVALINK_PASSWORD}" # Internal password shared between Lavalink and your bot
    sources:
      youtube: false # Handled by the youtube-plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO